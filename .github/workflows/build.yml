name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Virtual Home Screen
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild \
            -project VirtualHomeScreen.xcodeproj \
            -scheme VirtualHomeScreen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/VirtualHomeScreen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive || true

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: VirtualHomeScreen-Archive
          path: build/VirtualHomeScreen.xcarchive
          if-no-files-found: warn
          retention-days: 7
