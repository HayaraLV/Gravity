name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Virtual Home Screen
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || \
          sudo xcode-select -s /Applications/Xcode_15.4.app || \
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project VirtualHomeScreen.xcodeproj

      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project VirtualHomeScreen.xcodeproj \
            -scheme VirtualHomeScreen \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/VirtualHomeScreen.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Check archive
        run: |
          echo "=== Archive contents ==="
          find build -type f | head -30
          echo "=== App binary size ==="
          ls -lh build/VirtualHomeScreen.xcarchive/Products/Applications/VirtualHomeScreen.app/VirtualHomeScreen || true

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: VirtualHomeScreen-Archive
          path: build/VirtualHomeScreen.xcarchive
          if-no-files-found: error
          retention-days: 5
