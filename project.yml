name: VirtualHomeScreen
options:
  bundleIdPrefix: com.virtualhome
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: VirtualHomeScreen/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.virtualhome.screen
    DEVELOPMENT_TEAM: ""          # потом можно вписать Team ID
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  VirtualHomeScreen:
    type: application
    platform: iOS
    sources:
      - path: VirtualHomeScreen
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_NAME: VirtualHomeScreen
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: VirtualHomeScreen/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPAD: false
    info:
      path: VirtualHomeScreen/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMotionUsageDescription: "Приложению нужен доступ к датчикам движения, чтобы иконки реагировали на наклон и тряску телефона."
        CFBundleDisplayName: Virtual Home
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
